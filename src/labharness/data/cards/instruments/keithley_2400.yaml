card: 1
id: keithley/2400
model: Keithley 2400-series SourceMeter (2400, 2401, 2410, 2420, 2425, 2430, 2440)
vendor: Keithley / Tektronix
kind: source-meter
status: community
manual: "Keithley Series 2400 SourceMeter User's Manual, SCPI command reference"
manual_url: "https://download.tek.com/manual/2400S-900-01_K-Sep2011_User.pdf"
identify:
  idn: "KEITHLEY INSTRUMENTS INC\\.?,MODEL 24(00|01|10|20|25|30|40)"
  example: "KEITHLEY INSTRUMENTS INC.,MODEL 2400,1234567,C30   Mar 17 2006 09:29:29/A02  /K/J"
  also:
    - idn: "^KEITHLEY INSTRUMENTS,MODEL 2400,\\d{8},\\d+\\.\\d+\\.\\d+\\w*"
      example: "KEITHLEY INSTRUMENTS,MODEL 2400,04453531,1.6.7c"
      is: "a Keithley 2450 (or another of Keithley's touchscreen SourceMeters: its identity doesn't say which) set to its 2400 command set. For its own commands, set Command Set to SCPI at its front panel (Menu > System > Settings), restart it, and use the keithley/2450 card"
      check: { query: "*LANG?", expect: "SCPI2400" }
connection: { timeout_ms: 5000 }
error_query: ":SYSTem:ERRor[:NEXT]?"
safe_sequence: [V, I_source, output, compliance_I, compliance_V, source_function]

parameters:
  V:
    label: Source voltage
    applies_when: output
    kind: drive
    unit: V
    set: ":SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude] {value}"
    get: ":SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude]?"
    limits: [-210, 210]
    safe: 0
    ramp: gate
    max_rate: 10
    ramp_step: 0.05
    description: Source voltage (voltage-source mode). The 2401 is limited to ±21 V; set lab limits.
    source_range: { param: V_range, auto: V_autorange, steps: [0.2, 2, 20, 200] }
    current_limit: compliance_I
  I_source:
    label: Source current
    applies_when: output
    kind: drive
    unit: A
    set: ":SOURce:CURRent[:LEVel][:IMMediate][:AMPLitude] {value}"
    get: ":SOURce:CURRent[:LEVel][:IMMediate][:AMPLitude]?"
    limits: [-1.05, 1.05]
    safe: 0
    ramp: gate
    max_rate: 0.01
    ramp_step: 0.0005
    description: Source current (current-source mode, source_function current). The output applies it only in that mode; compliance_V limits the voltage it may reach. Set lab limits for the device.
    source_range: { param: I_range, auto: I_autorange, steps: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1] }
  V_range:
    label: Source range
    kind: measure
    unit: V
    set: ":SOURce:VOLTage:RANGe {value}"
    get: ":SOURce:VOLTage:RANGe?"
    limits: [0.2, 210]
    default: 20
    description: The source's output range. Kelvin changes it only while V is at 0, and fixes it just above a mounted device's limit.
  V_autorange:
    label: Source autorange
    kind: measure
    type: bool
    set: ":SOURce:VOLTage:RANGe:AUTO {value}"
    get: ":SOURce:VOLTage:RANGe:AUTO?"
    default: on
    description: Lets the source pick its own range. A range change under bias can glitch the output, so a mounted device's protection keeps it off.
  I_range:
    label: Current source range
    kind: measure
    unit: A
    set: ":SOURce:CURRent:RANGe {value}"
    get: ":SOURce:CURRent:RANGe?"
    limits: [1.0e-6, 1.05]
    default: 1.0e-4
    description: The current source's output range. Kelvin changes it only while I_source is at 0.
  I_autorange:
    label: Current source autorange
    kind: measure
    type: bool
    set: ":SOURce:CURRent:RANGe:AUTO {value}"
    get: ":SOURce:CURRent:RANGe:AUTO?"
    default: on
    description: Lets the current source pick its own range; a mounted device's protection keeps it off.
  compliance_I:
    label: Current compliance
    applies_when: output
    kind: drive
    unit: A
    set: ":SENSe:CURRent[:DC]:PROTection[:LEVel] {value}"
    get: ":SENSe:CURRent[:DC]:PROTection[:LEVel]?"
    limits: [1.0e-9, 1.05]
    safe: 1.0e-9
    default: 1.0e-4
    description: Largest current the source lets flow; raising it is a drive change
  output:
    label: Output
    kind: drive
    type: bool
    set: ":OUTPut[:STATe] {value}"
    get: ":OUTPut[:STATe]?"
    safe: off
    enables: [V, compliance_I, I_source, compliance_V]
    description: Connects the source to the device. Switching it on applies V and compliance_I, or I_source and compliance_V in current mode; any of them nobody set yet goes to its safe value first (V and I_source 0, compliance_I 1 nA, compliance_V 0.2 V), so set the compliance you need before the output goes on
  compliance_V:
    label: Voltage compliance
    applies_when: output
    kind: drive
    unit: V
    set: ":SENSe:VOLTage[:DC]:PROTection[:LEVel] {value}"
    get: ":SENSe:VOLTage[:DC]:PROTection[:LEVel]?"
    limits: [0.2, 210]
    safe: 0.2
    default: 21
    description: The highest voltage the current source may reach (current-source mode).
  source_function:
    label: Source function
    kind: drive
    type: enum
    set: ":SOURce:FUNCtion[:MODE] {value}"
    get: ":SOURce:FUNCtion[:MODE]?"
    values: { voltage: VOLTage, current: CURRent, memory: MEMory }
    safe: voltage
    description: What the output applies, voltage (V) or current (I_source). Switching it changes what reaches the device, so it is a drive, approved like one; a card that switches the output on says which it is, also when someone switched it at the front panel.
  I:
    label: Current
    kind: measure
    unit: A
    get: ":READ?"
    field: 1
    read_when: output
    description: Measured current. :READ? turns the output on, so Kelvin only reads while the output is already on, and only while the instrument takes one reading at a time (the checks below); V_meas comes from the same reading.
  V_meas:
    label: Measured voltage
    kind: measure
    unit: V
    get: ":READ?"
    field: 0
    read_when: output
  nplc:
    label: Integration (NPLC)
    kind: measure
    unit: PLC
    set: ":SENSe:CURRent[:DC]:NPLCycles {value}"
    get: ":SENSe:CURRent[:DC]:NPLCycles?"
    limits: [0.01, 10]
    default: 1

display:
  headline: I

health:
  - query: "*IDN?"
    expect: "KEITHLEY"
  - query: ":SYSTem:ERRor?"
    expect: "^[+]?0,"
  - query: ":ARM:COUNt?"
    expect: "^\\s*\\+?0*1(\\.0*)?(E[+-]?0+)?\\s*$"
    says: "it is set to measure continuously (its arm count isn't 1), so it never answers :READ?: Stop continuous mode (action stop_continuous) first"
    before: [I, V_meas]
  - query: ":TRIGger:COUNt?"
    expect: "^\\s*\\+?0*1(\\.0*)?(E[+-]?0+)?\\s*$"
    says: "it takes more than one reading for each :READ? (its trigger count isn't 1): Stop continuous mode (action stop_continuous) first"
    before: [I, V_meas]
  - query: ":ARM:SOURce?"
    expect: "^\\s*IMM"
    says: "it waits for a trigger before it measures (its arm source isn't immediate), so :READ? would wait: Stop continuous mode (action stop_continuous) first"
    before: [I, V_meas]
  - query: ":TRIGger:SOURce?"
    expect: "^\\s*IMM"
    says: "it waits for a trigger before each reading (its trigger source isn't immediate), so :READ? would wait: Stop continuous mode (action stop_continuous) first"
    before: [I, V_meas]
  - query: ":FORMat:ELEMents?"
    expect: "^\\s*VOLT\\w*,CURR"
    says: "its readings come in another order (:FORMat:ELEMents), so V_meas and I would be taken from the wrong places: set Kelvin's reading order (action reading_order) first"
    before: [I, V_meas]
actions:
  stop_continuous:
    label: Stop continuous mode
    send: [":ABORt", ":ARM:COUNt 1", ":TRIGger:COUNt 1", ":ARM:SOURce IMMediate", ":TRIGger:SOURce IMMediate"]
    drives: output
  reading_order:
    label: Kelvin's reading order
    send: ":FORMat:ELEMents VOLTage,CURRent,RESistance,TIME,STATus"
  clear_errors:
    label: Clear its error queue
    send: "*CLS"
raw:
  reset: ["*RST", ":SYSTem:PRESet"]
  blocked: [":CALibration", ":SYSTem:PASSword"]
notes:
  - Written from the manual; verify on your unit before trusting it with a sample.
  - Readings assume the default :FORMat:ELEMents (voltage, current, resistance, time, status), and one reading per :READ?; Kelvin checks both before it reads, and says what to do when another program or the front panel left it otherwise.
  - Left measuring continuously (arm count infinite), it answers nothing to :READ? (error 830), and asking it again and again hung a whole GPIB bus in a field test. Stop continuous mode (:ABORt, then one reading at a time) asks a person while the output is on, as :ABORt can switch it off.
