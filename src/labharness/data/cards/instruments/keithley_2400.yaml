card: 1
id: keithley/2400
model: Keithley 2400-series SourceMeter (2400, 2401, 2410, 2420, 2425, 2430, 2440)
vendor: Keithley / Tektronix
kind: source-meter
status: community
manual: "Keithley Series 2400 SourceMeter User's Manual, SCPI command reference"
manual_url: "https://download.tek.com/manual/2400S-900-01_K-Sep2011_User.pdf"
identify:
  idn: "KEITHLEY INSTRUMENTS INC\\.?,MODEL 24(00|01|10|20|25|30|40)"
  example: "KEITHLEY INSTRUMENTS INC.,MODEL 2400,1234567,C30   Mar 17 2006 09:29:29/A02  /K/J"
connection: { timeout_ms: 5000 }
error_query: ":SYSTem:ERRor[:NEXT]?"
safe_sequence: [V, I_source, output, compliance_I, compliance_V, source_function]

parameters:
  V:
    label: Source voltage
    applies_when: output
    kind: drive
    unit: V
    set: ":SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude] {value}"
    get: ":SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude]?"
    limits: [-210, 210]
    safe: 0
    ramp: gate
    max_rate: 10
    ramp_step: 0.05
    description: Source voltage (voltage-source mode). The 2401 is limited to ±21 V; set lab limits.
    source_range: { param: V_range, auto: V_autorange, steps: [0.2, 2, 20, 200] }
    current_limit: compliance_I
  I_source:
    label: Source current
    applies_when: output
    kind: drive
    unit: A
    set: ":SOURce:CURRent[:LEVel][:IMMediate][:AMPLitude] {value}"
    get: ":SOURce:CURRent[:LEVel][:IMMediate][:AMPLitude]?"
    limits: [-1.05, 1.05]
    safe: 0
    ramp: gate
    max_rate: 0.01
    ramp_step: 0.0005
    description: Source current (current-source mode, source_function current). The output applies it only in that mode; compliance_V limits the voltage it may reach. Set lab limits for the device.
    source_range: { param: I_range, auto: I_autorange, steps: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1] }
  V_range:
    label: Source range
    kind: measure
    unit: V
    set: ":SOURce:VOLTage:RANGe {value}"
    get: ":SOURce:VOLTage:RANGe?"
    limits: [0.2, 210]
    default: 20
    description: The source's output range. Kelvin changes it only while V is at 0, and fixes it just above a mounted device's limit.
  V_autorange:
    label: Source autorange
    kind: measure
    type: bool
    set: ":SOURce:VOLTage:RANGe:AUTO {value}"
    get: ":SOURce:VOLTage:RANGe:AUTO?"
    default: on
    description: Lets the source pick its own range. A range change under bias can glitch the output, so a mounted device's protection keeps it off.
  I_range:
    label: Current source range
    kind: measure
    unit: A
    set: ":SOURce:CURRent:RANGe {value}"
    get: ":SOURce:CURRent:RANGe?"
    limits: [1.0e-6, 1.05]
    default: 1.0e-4
    description: The current source's output range. Kelvin changes it only while I_source is at 0.
  I_autorange:
    label: Current source autorange
    kind: measure
    type: bool
    set: ":SOURce:CURRent:RANGe:AUTO {value}"
    get: ":SOURce:CURRent:RANGe:AUTO?"
    default: on
    description: Lets the current source pick its own range; a mounted device's protection keeps it off.
  compliance_I:
    label: Current compliance
    applies_when: output
    kind: drive
    unit: A
    set: ":SENSe:CURRent[:DC]:PROTection[:LEVel] {value}"
    get: ":SENSe:CURRent[:DC]:PROTection[:LEVel]?"
    limits: [1.0e-9, 1.05]
    safe: 1.0e-9
    default: 1.0e-4
    description: Largest current the source lets flow; raising it is a drive change
  output:
    label: Output
    kind: drive
    type: bool
    set: ":OUTPut[:STATe] {value}"
    get: ":OUTPut[:STATe]?"
    safe: off
    enables: [V, compliance_I, I_source, compliance_V]
    description: Connects the source to the device
  compliance_V:
    label: Voltage compliance
    applies_when: output
    kind: drive
    unit: V
    set: ":SENSe:VOLTage[:DC]:PROTection[:LEVel] {value}"
    get: ":SENSe:VOLTage[:DC]:PROTection[:LEVel]?"
    limits: [0.2, 210]
    safe: 0.2
    default: 21
    description: The highest voltage the current source may reach (current-source mode).
  source_function:
    label: Source function
    kind: drive
    type: enum
    set: ":SOURce:FUNCtion[:MODE] {value}"
    get: ":SOURce:FUNCtion[:MODE]?"
    values: { voltage: VOLTage, current: CURRent, memory: MEMory }
    safe: voltage
    description: What the output applies, voltage (V) or current (I_source). Switching it changes what reaches the device, so it is a drive, approved like one; a card that switches the output on says which it is, also when someone switched it at the front panel.
  I:
    label: Current
    kind: measure
    unit: A
    get: ":READ?"
    field: 1
    read_when: output
    description: Measured current. :READ? turns the output on, so Kelvin only reads while the output is already on.
  V_meas:
    label: Measured voltage
    kind: measure
    unit: V
    get: ":READ?"
    field: 0
    read_when: output
  nplc:
    label: Integration (NPLC)
    kind: measure
    unit: PLC
    set: ":SENSe:CURRent[:DC]:NPLCycles {value}"
    get: ":SENSe:CURRent[:DC]:NPLCycles?"
    limits: [0.01, 10]
    default: 1

display:
  headline: I

health:
  - query: "*IDN?"
    expect: "KEITHLEY"
  - query: ":SYSTem:ERRor?"
    expect: "^[+]?0,"
raw:
  reset: ["*RST", ":SYSTem:PRESet"]
  blocked: [":CALibration", ":SYSTem:PASSword"]
notes:
  - Written from the manual; verify on your unit before trusting it with a sample.
  - Readings assume the default :FORMat:ELEMents (voltage, current, resistance, time, status).
