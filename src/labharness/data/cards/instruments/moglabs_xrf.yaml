card: 1
id: moglabs/xrf
model: MOGLabs XRF / ARF agile RF synthesizer and AOM driver (QRF similar)
vendor: MOGLabs
kind: aom-driver
status: community
manual: "MOGLabs Agile RF Synthesizer & AOM driver XRF421, rev 1.8.5, Appendix C (commands)"
manual_url: "https://santec-inst.files.svdcdn.com/production/Files/Tutorials/RF-generators-synthesizers/MOGLabs_XRF_manual.pdf"
notes:
  - "Ethernet: raw TCP port 7802 (address TCPIP0::<ip>::7802::SOCKET), or its USB virtual COM port. Every command answers OK or ERR, and Kelvin checks each set's reply."
  - "Kelvin leaves the channel as it finds it when it connects. The RF on/off state has no read-back, so until Kelvin sets it, it is unknown: switching it on needs approval, and switching it off always goes ahead. Fast on/off for pulses comes from the pulse generator on the DE15 CHx-OFF pin."
  - "LIMIT is the hardware power cap (default +30 dBm on amplified models): Kelvin never raises it. Keep 50 ohm on each output."
  - "Frequencies in MHz (20-400 MHz on XRF/ARF; 10-200 MHz on the QRF). The power read-back format is not shown in the manual: check it on your unit."
identify:
  query: "INFO"
connection:
  read_termination: "\r\n"
  write_termination: "\r\n"
  set_reply: "^OK"
vars:
  ch: { default: "1", label: "Channel (1 or 2; 1-4 on a QRF)" }
parameters:
  output:
    label: RF output
    kind: drive
    type: bool
    set: "{value},{ch}"
    bool_text: ["ON", "OFF"]
    safe: off
    description: Switches the RF switch and the amplifier together (ON,ch / OFF,ch); the amplifier takes about 2 s to settle
  power:
    label: Power
    kind: drive
    unit: dBm
    set: "POW,{ch},{value}"
    get: "POW,{ch}"
    parse: '(-?[0-9]+[.]?[0-9]*)'
    limits: [-50, 34]
    safe: -50
    ramp: gate
    max_rate: 5
    ramp_step: 0.5
  frequency:
    label: Frequency
    kind: measure
    unit: MHz
    set: "FREQ,{ch},{value}"
    get: "FREQ,{ch}"
    parse: '([0-9]+[.]?[0-9]*)'
    limits: [10, 400]

safe_sequence: [power, output]
display:
  headline: frequency
raw:
  blocked: ["LIMIT", "LIM", "SINC", "TABLE", "SET", "DDS", "REBOOT", "RESET", "CLKSRC", "CALMOD"]
