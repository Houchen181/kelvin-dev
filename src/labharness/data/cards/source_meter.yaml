card: 1
id: virtual/source-meter
model: Virtual Source-Meter
vendor: Kelvin (simulated)
kind: source-meter
status: community
twin: labharness.sim.twins:SourceMeterTwin
identify:
  idn: "^VIRTUAL,SOURCE-METER"
  example: "VIRTUAL,SOURCE-METER,SN0001,1.0"
error_query: "SYSTem:ERRor[:NEXT]?"

parameters:
  V:
    label: Voltage
    applies_when: output
    kind: drive
    unit: V
    set: "SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude] {value}"
    get: "SOURce:VOLTage[:LEVel][:IMMediate][:AMPLitude]?"
    limits: [-210, 210]
    safe: 0
    ramp: gate
    max_rate: 10
    ramp_step: 0.05
    description: Source voltage, e.g. a gate
    source_range: { param: V_range, auto: V_autorange, steps: [0.2, 2, 20, 200] }
    current_limit: compliance_I
  V_range:
    label: Source range
    kind: measure
    unit: V
    set: "SOURce:VOLTage:RANGe {value}"
    get: "SOURce:VOLTage:RANGe?"
    limits: [0.2, 200]
    default: 20
    description: The source's output range. Kelvin changes it only while V is at 0, and fixes it just above a mounted device's limit.
  V_autorange:
    label: Source autorange
    kind: measure
    type: bool
    set: "SOURce:VOLTage:RANGe:AUTO {value}"
    get: "SOURce:VOLTage:RANGe:AUTO?"
    default: on
    description: Lets the source pick its own range. A range change under bias can glitch the output, so a mounted device's protection keeps it off.
  compliance_I:
    label: Compliance
    applies_when: output
    kind: drive
    unit: A
    set: "SENSe:CURRent[:DC]:PROTection[:LEVel] {value}"
    get: "SENSe:CURRent[:DC]:PROTection[:LEVel]?"
    limits: [1.0e-9, 1.05]
    safe: 1.0e-9
    default: 1.0e-4
    description: Current compliance; raising it lets more current flow
  output:
    label: Output
    kind: drive
    type: bool
    set: "OUTPut[:STATe] {value}"
    get: "OUTPut[:STATe]?"
    safe: off
    enables: [V]
    description: Connects the source to the device
  I:
    label: Current
    kind: measure
    unit: A
    get: "MEASure:CURRent[:DC]?"
  nplc:
    label: Integration (NPLC)
    kind: measure
    unit: PLC
    set: "SENSe:CURRent[:DC]:NPLCycles {value}"
    get: "SENSe:CURRent[:DC]:NPLCycles?"
    limits: [0.01, 10]
    default: 1

safe_sequence: [V, output, compliance_I]
display:
  headline: I

health:
  - query: "SYSTem:ERRor?"
    expect: "^\\+?0,"
raw:
  reset: ["*RST", "SYSTem:PRESet"]
  blocked: ["CALibration", "SYSTem:FIRMware", "DIAGnostic"]
notes:
  - Generic SCPI source-meter. In the toy sample, the gate dielectric breaks down above 12 V.
