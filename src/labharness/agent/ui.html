<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelvin approvals</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e8f2fc'/%3E%3Cg transform='translate(9.8 4.9) scale(0.82)'%3E%3Cpath d='M24 20V38M16 24.5L32 33.5M16 33.5L32 24.5' stroke='%238cc4f2' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M18 66Q16 86 40 86Q60 86 68 76' fill='none' stroke='%232f6fb0' stroke-width='7' stroke-linecap='round'/%3E%3Cellipse cx='46' cy='62' rx='30' ry='19' fill='%232f6fb0'/%3E%3Cpath d='M60 43L62 30L69 38ZM82 43L80 30L73 38Z' fill='%232f6fb0'/%3E%3Ccircle cx='71' cy='50' r='14' fill='%232f6fb0'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --text: #14202c; --muted: #66768a; --line: #dde5ee;
    --accent: #2f6fb0; --accent-text: #ffffff; --ok: #1a7f37; --warn-bg: #fff8e6; --warn-line: #e3b341;
    --danger: #c62828; --danger-text: #ffffff; --away: #9a6700; --away-bg: #fff4d6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 24px rgba(0, 0, 0, .06); --scrim: rgba(0, 0, 0, .4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c; --panel: #141c25; --text: #e6edf4; --muted: #8d9aa8; --line: #24303c;
      --accent: #5aa2e6; --accent-text: #08111a; --ok: #3fb950; --warn-bg: #2a2410; --warn-line: #9e7a1d;
      --danger: #ef5350; --danger-text: #0b0d10; --away: #e3b341; --away-bg: #2a2410;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35); --scrim: rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .spacer { flex: 1; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { background: var(--danger); color: var(--danger-text); border-color: var(--danger); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .request { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .request h3 { margin: 0 0 6px; font-size: 15px; }
  .request ul { margin: 0 0 10px; padding-left: 18px; }
  .request li { margin: 2px 0; overflow-wrap: anywhere; }
  .request .figure { display: block; max-width: 100%; height: auto; margin: 0 0 10px; background: #fff; border-radius: 6px; }
  .request .lessons { margin: -4px 0 10px; font-size: 13px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.name { font-weight: 600; white-space: nowrap; padding-right: 10px; }
  .chip { display: inline-block; margin: 2px 6px 2px 0; padding: 1px 7px; border-radius: 6px; font-size: 13px;
          border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip.away { color: var(--away); background: var(--away-bg); border-color: var(--warn-line); font-weight: 600; }
  ol.events { list-style: none; margin: 0; padding: 0; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  ol.events li { padding: 3px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .history li { font-size: 13px; }
  #nokey { display: none; }
  .mode { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .mode select { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 8px; }
  .mode.auto select { border-color: var(--warn-line); background: var(--warn-bg); font-weight: 600; }
  /* a question asked in the page (ask), never in the browser's own boxes: its heading, what it means, a box for the
     answer when one is typed, Cancel and OK at its foot */
  dialog.ask { width: min(440px, calc(100% - 32px)); padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
               background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  dialog.ask::backdrop { background: var(--scrim); }
  /* why a change of the mode, or Stop, did not go through: in the bar beside them, until the next one does */
  .said { font-size: 13px; color: var(--danger); overflow-wrap: anywhere; }
  .said:empty { display: none; }
  dialog.ask form { display: grid; gap: 10px; }
  dialog.ask h2 { margin: 0; font-size: 16px; font-weight: 650; }
  dialog.ask p { margin: 0; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  dialog.ask input { width: 100%; font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
                     color: var(--text); padding: 7px 10px; }
  dialog.ask .actions { justify-content: flex-end; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Kelvin</h1>
  <span id="lab" class="muted"></span>
  <span id="sim" class="badge" hidden>simulated</span>
  <span class="muted"><span id="conn" class="dot"></span><span id="conntext">connecting…</span></span>
  <span id="busy" class="muted"></span>
  <span class="spacer"></span>
  <span id="said" class="said" role="status"></span>
  <label id="mode-box" class="mode" title="Who approves drive changes">Approvals
    <select id="mode"><option value="ask">Ask me every time</option><option value="auto">Auto for low-risk changes</option></select>
  </label>
  <button id="notify" hidden>Enable notifications</button>
  <button id="stop" class="danger" title="Stop the agent's current ramp or plan and decline open requests. Drives stay where they are.">Stop</button>
</header>
<main>
  <section id="nokey">
    <h2>Access key missing</h2>
    <p>Open the link printed by the Kelvin server. It ends in <code>#</code> plus an access key.</p>
  </section>
  <section>
    <h2>Waiting for you</h2>
    <div id="pending"><p class="empty">Nothing to approve.</p></div>
    <ul id="history" class="history muted"></ul>
  </section>
  <div class="grid2">
    <section>
      <h2>Instruments <span class="muted" style="text-transform:none;letter-spacing:0">· highlighted = away from safe</span></h2>
      <table><tbody id="status"></tbody></table>
    </section>
    <section>
      <h2>Activity</h2>
      <ol id="events" class="events"></ol>
    </section>
  </div>
</main>
<script>
"use strict";
const token = decodeURIComponent(location.hash.slice(1));
const $ = (id) => document.getElementById(id);
const seen = new Set();
let firstLoad = true;
// the approval mode the server last gave, and whether a change of it is on its way (asked, then sent): meanwhile the
// poll leaves the select alone, and when it ends the select shows what holds, the mode chosen or the one before; ends
// counts the changes ended, so a state asked for before one ended is not its last word
const MODE = { now: "ask", busy: false, ends: 0 };
const say = (text) => { $("said").textContent = text || ""; };   // why the last change or Stop did not go through

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}

// A question asked in the page, never in the browser's own boxes, as Kelvin's own page asks (askYes): the first line
// is its heading, the rest says what it means. o.pin: a box for the lab owner's PIN, and the answer is what
// was typed ("" for no); else true or false. Esc means no, and so does the backdrop, only when the press started on it.
// A click in its first 0.4 s, or the second of a double-click, is no answer; a key always is one. o.focus "cancel":
// it starts on Cancel.
function ask(text, o) {
  o = o || {};
  const lines = String(text).split("\n").map((s) => s.trim()).filter(Boolean), head = lines.shift();
  const box = o.pin ? el("input", { type: "password", inputmode: "numeric", autocomplete: "off", maxlength: "12",
                                    "aria-label": "Lab owner's PIN" }) : null;
  const no = el("button", { type: "button" }, "Cancel");
  const yes = el("button", { type: "button", class: "primary" }, o.ok || "OK");
  const form = el("form", {}, el("h2", { id: "ask-head" }, head), ...lines.map((l) => el("p", {}, l)), ...(box ? [box] : []),
    el("div", { class: "actions" }, no, yes));
  const dlg = el("dialog", { class: "ask", "aria-labelledby": "ask-head" }, form);
  const none = box ? "" : false, opened = Date.now();
  return new Promise((resolve) => {
    let over = false, downOut = false;
    const early = (e) => e.detail > 0 && (e.detail > 1 || Date.now() - opened < 400);
    const outside = (e) => {
      const r = dlg.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    };
    const finish = (v) => { if (over) return; over = true; if (dlg.open) dlg.close(); dlg.remove(); resolve(v); };
    yes.addEventListener("click", (e) => { if (!early(e)) finish(box ? box.value.trim() : true); });
    no.addEventListener("click", (e) => { if (!early(e)) finish(none); });
    form.addEventListener("submit", (e) => e.preventDefault());
    if (box) box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); finish(box.value.trim()); } });
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); finish(none); });
    dlg.addEventListener("pointerdown", (e) => { downOut = e.target === dlg && outside(e); });
    dlg.addEventListener("click", (e) => { if (e.target === dlg && downOut && outside(e) && !early(e)) finish(none); downOut = false; });
    document.body.append(dlg);
    dlg.showModal();
    (box || (o.focus === "cancel" ? no : yes)).focus();
  });
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Kelvin-Token": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (res.status === 403 && data && data.pin && body) {   // the lab owner's PIN: ask, try again
      // the server's reason is the question: its heading, and after a colon the line under it, each a sentence
      const why = String(data.error || "this needs the lab owner's PIN").split(/:\s+/)
        .map((s) => s.charAt(0).toUpperCase() + s.slice(1));
      const pin = await ask(why.join("\n"), { pin: true });
      if (pin) return api(path, Object.assign({}, body, { pin }));
      const no = new Error("not changed");   // Cancel: nothing changes, and there is nothing to say
      no.cancelled = true;
      throw no;
    }
    throw new Error((data && data.error) || res.status);
  }
  return res.json();
}

async function answer(id, approve, buttons) {
  buttons.forEach((b) => (b.disabled = true));
  try { await api("/api/answer", { id, approve }); } catch (e) { /* already answered or expired */ }
  refresh();
}

function renderPending(list) {
  const box = $("pending");
  box.replaceChildren();
  if (!list.length) { box.append(el("p", { class: "empty" }, "Nothing to approve.")); return; }
  for (const r of list) {
    const ok = el("button", { class: "primary" }, "Approve");
    const no = el("button", {}, "Decline");
    ok.addEventListener("click", () => answer(r.id, true, [ok, no]));
    no.addEventListener("click", () => answer(r.id, false, [ok, no]));
    box.append(el("div", { class: "request" },
      el("h3", {}, (r.where ? "[" + r.where + "] " : "") + r.title),
      el("ul", {}, ...r.items.map((i) => el("li", {}, i))),
      // a pulse generator's timing: an SVG shown as an image, which can't run anything
      ...(r.figures || []).map((f) => el("img", { class: "figure", alt: f.caption || "",
        src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(String(f.svg || "")) })),
      ...((r.lessons || []).length ? [el("p", { class: "lessons" }, "From the lab's memory: " + r.lessons.join(" · "))] : []),
      el("div", { class: "actions" }, ok, no, el("span", { class: "muted" }, "declines itself in " + r.seconds_left + " s"))));
    if (!seen.has(r.id)) {
      seen.add(r.id);
      if (!firstLoad && "Notification" in window && Notification.permission === "granted") {
        new Notification("Kelvin: approval needed", { body: r.title + "\n" + (r.items[0] || "") });
      }
    }
  }
}

function render(s) {
  $("lab").textContent = s.lab;
  $("sim").hidden = !s.simulated;
  $("busy").textContent = s.busy ? "agent: " + s.busy : "agent: idle";
  renderPending(s.pending);
  document.title = (s.pending.length ? "(" + s.pending.length + ") Approve? · " : "") + "Kelvin";
  $("history").replaceChildren(...s.history.slice(0, 5).map((h) =>
    el("li", {}, h.at + " " + h.answer + (h.by && h.by !== "human" ? " (" + h.by + ")" : "") + ": " + (h.items[0] || h.title))));
  $("status").replaceChildren(...Object.entries(s.status).map(([name, params]) =>
    el("tr", {}, el("td", { class: "name" }, name),
      el("td", {}, ...params.map((p) => el("span", { class: "chip" + (p.away ? " away" : "") }, p.name + " " + p.value))))));
  $("events").replaceChildren(...s.events.map((e) => el("li", {}, e)));
  MODE.now = s.approval_mode || "ask";
  if (!MODE.busy && $("mode").value !== MODE.now) $("mode").value = MODE.now;
  $("mode-box").classList.toggle("auto", s.approval_mode === "auto");
  firstLoad = false;
}

async function refresh() {
  if (!token) { $("nokey").style.display = "block"; return; }
  const ends = MODE.ends;
  try {
    const s = await api("/api/state");
    if (ends !== MODE.ends) return;   // asked for before a change of the mode ended: the next poll's is newer
    render(s);
    $("conn").className = "dot on"; $("conntext").textContent = "connected";
  } catch (e) {
    $("conn").className = "dot"; $("conntext").textContent = e.message === "401" ? "wrong access key" : "server not reachable";
  }
}

// a change of the mode: auto mode is asked first (Cancel has the focus), and may ask for the PIN; a no to either keeps
// the mode as it was, saying nothing. Meanwhile the poll leaves the select alone (MODE.busy)
$("mode").addEventListener("change", async (e) => {
  const sel = e.target, mode = sel.value;
  MODE.busy = true;
  try {
    if (mode === "auto") {
      let rule = "";
      try { rule = (await api("/api/state")).approval_rule || ""; } catch (err) { /* keep it short */ }
      if (!(await ask("Turn on auto mode?\nKelvin then approves low-risk changes for you: " + rule +
                      "\nEverything else still waits for you. It goes back to asking when Kelvin restarts.",
                      { ok: "Turn on", focus: "cancel" }))) return;
    }
    MODE.now = (await api("/api/mode", { mode })).mode || mode;
    say("");
  } catch (err) {
    if (!err.cancelled) say("Could not change the mode: " + err.message);
  } finally {
    MODE.busy = false;
    MODE.ends += 1;
    sel.value = MODE.now;   // what holds now, though the select kept the focus
    refresh();
  }
});

$("stop").addEventListener("click", async () => {   // at once: no dialog on the stop path
  try { await api("/api/stop", {}); say(""); } catch (e) { say("Stop failed: " + e.message); }
  refresh();
});

if ("Notification" in window && Notification.permission === "default") {
  $("notify").hidden = false;
  $("notify").addEventListener("click", async () => { await Notification.requestPermission(); $("notify").hidden = true; });
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
