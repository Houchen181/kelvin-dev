name: iOS TestFlight

# Builds, signs and uploads the iPhone app to App Store Connect (TestFlight) when a tag such as ios-v0.1.0 is pushed.
# Signing is Apple's cloud signing with an App Store Connect API key: no certificate or Mac needed.
# Repository secrets (docs/ios.md says how to make them):
#   APPLE_TEAM_ID   the Apple Developer team id
#   ASC_KEY_ID      the API key's id
#   ASC_ISSUER_ID   the issuer id shown above the keys
#   ASC_KEY_P8      the text of the AuthKey_<id>.p8 file (an Admin key, so it may make the distribution certificate)
on:
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets, and write the API key for this job only
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 .github/scripts/asc_key.py "$RUNNER_TEMP/AuthKey.p8"
      - name: Use the newest Xcode (App Store Connect takes builds from Xcode 26 or later)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$major" -ge 26 ] || { echo "::error::Uploads need Xcode 26 or later; the newest here is $major"; exit 1; }
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Version and build number
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Archive
        # Archived unsigned; the export below signs it for the App Store (an App Store profile needs no devices).
        run: |
          set -o pipefail
          xcodebuild archive -project ios/Kelvin.xcodeproj -scheme Kelvin -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Kelvin.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" 2>&1 | tee archive.log \
            | grep -E "error:|[*][*] ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kelvin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded Kelvin ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}). App Store Connect processes it for 10-30 minutes; then it appears in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: archive.log
          if-no-files-found: ignore
