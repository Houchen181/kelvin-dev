name: release

# Builds the desktop apps. Push a tag like v0.1.0 to also publish a GitHub Release;
# run it by hand (Actions > release > Run workflow) to only build and test.
# A tag like private-v0.3.6 makes the private Windows build (the temporary Claude Code bridge, see
# claudecode.py) as a pre-release, never "latest"; installed Kelvins with the bridge update from those.
on:
  push:
    tags: ["v*", "private-v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[web,desktop]" "pyinstaller>=6"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from labharness._version import __version__; print(__version__)"
          $tag = "$env:GITHUB_REF_NAME" -replace '^(private-)?v', ''
          if ($tag -ne $version) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
      - name: Mark the private build
        if: startsWith(github.ref, 'refs/tags/private-v')
        run: |
          python -c "open('src/labharness/_private_bridge.py', 'w').write('# private build, the Claude Code bridge is in')"
      - name: Build the app
        run: pyinstaller packaging/kelvin.spec --noconfirm --distpath dist --workpath build
      - name: Self-test the app
        shell: pwsh
        run: |
          $p = Start-Process dist\Kelvin\Kelvin.exe -ArgumentList "--self-test","--home","$env:RUNNER_TEMP\kelvin-a" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\kelvin-a\kelvin.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import sys; sys.path.insert(0, 'src'); from labharness._version import __version__; print(__version__)"
          $suffix = if ("$env:GITHUB_REF" -like "refs/tags/private-v*") { "-private" } else { "" }
          & $iscc "/DAppVersion=$version" "/DSuffix=$suffix" packaging\kelvin.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install it and self-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Kelvin-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Kelvin\Kelvin.exe" -ArgumentList "--self-test","--home","$env:RUNNER_TEMP\kelvin-b" -Wait -PassThru
          $log = Get-Content "$env:RUNNER_TEMP\kelvin-b\kelvin.log" -Raw
          $log
          if ($p.ExitCode -ne 0) { exit 1 }
          # the Claude Code bridge is in the private build only, never in a published one
          $private = "$env:GITHUB_REF" -like "refs/tags/private-v*"
          if ($private -ne ($log -match "Claude Code bridge on")) { throw "the Claude Code bridge is in the wrong build" }
      - name: Uninstall it; Kelvin's own data go, measurements stay
        shell: pwsh
        run: |
          $k = "$env:USERPROFILE\Kelvin"
          New-Item -ItemType Directory -Force "$k\virtual-lab\runs\r1", "$k\virtual-lab\chats", "$k\instruments\smu" | Out-Null
          Set-Content "$k\settings.json" "{}"
          Set-Content "$k\virtual-lab\chats\abc.json" "{}"
          Set-Content "$k\instruments\smu\instrument.json" "{}"
          Set-Content "$k\virtual-lab\runs\r1\data.jsonl" "{}"
          Set-Content "$k\virtual-lab\events.jsonl" "{}"
          $app = "$env:LOCALAPPDATA\Programs\Kelvin"
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\Kelvin.exe"); $i++) { Start-Sleep -Seconds 1 }   # it finishes in a copy of itself
          Get-ChildItem -Recurse $k | ForEach-Object { $_.FullName }
          if (Test-Path "$app\Kelvin.exe") { throw "the app is still installed" }
          foreach ($gone in "settings.json", "virtual-lab\chats", "instruments") { if (Test-Path "$k\$gone") { throw "$gone was not removed" } }
          foreach ($kept in "virtual-lab\runs\r1\data.jsonl", "virtual-lab\events.jsonl", "About this folder.txt") { if (-not (Test-Path "$k\$kept")) { throw "$kept is missing" } }
      - uses: actions/upload-artifact@v4
        with:
          name: kelvin-windows
          path: dist/Kelvin-Setup-*.exe

  macos:
    name: macOS app (Apple silicon)
    if: ${{ !startsWith(github.ref, 'refs/tags/private-v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[web,desktop]" "pyinstaller>=6"
      - name: Build the app
        run: pyinstaller packaging/kelvin.spec --noconfirm --distpath dist --workpath build
      - name: Self-test the app
        run: |
          ./dist/Kelvin.app/Contents/MacOS/Kelvin --self-test --home "$RUNNER_TEMP/kelvin-a"
          cat "$RUNNER_TEMP/kelvin-a/kelvin.log"
      - name: Zip
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from labharness._version import __version__; print(__version__)")
          ditto -c -k --keepParent dist/Kelvin.app "dist/Kelvin-$version-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kelvin-macos
          path: dist/Kelvin-*-macOS.zip

  release:
    name: Publish the release
    needs: [windows, macos]
    if: >-
      ${{ always() && needs.windows.result == 'success'
          && (startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
              || startsWith(github.ref, 'refs/tags/private-v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: The private build, as a pre-release (never "latest")
        if: startsWith(github.ref, 'refs/tags/private-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#private-v}"
          printf '%s\n' "**Private build, not a release.** Kelvin $version for Windows with the temporary Claude Code bridge (chats on your own Claude plan, and Claude operating the computer). It installs over the Kelvin that is there, like any update, and keeps itself up to date from later private builds. Published releases never have the bridge: Anthropic's terms don't let apps route requests through other people's Claude plans." > notes.md
          gh release create "$GITHUB_REF_NAME" out/Kelvin-Setup-*-private.exe --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --title "Kelvin $version, private build (not a release)" --notes-file notes.md
      - name: The README's download, the newest private build under a fixed name (release private-latest)
        if: startsWith(github.ref, 'refs/tags/private-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/latest can't point at a pre-release, so a rolling pre-release carries the newest private
          # installer as Kelvin-Setup-private.exe. Its tag isn't private-vX.Y.Z, so installed Kelvins never update
          # from it; they follow the numbered ones.
          version="${GITHUB_REF_NAME#private-v}"
          cp out/Kelvin-Setup-*-private.exe out/Kelvin-Setup-private.exe
          printf '%s\n' "**The newest private build, not a release.** This is always Kelvin's newest private Windows build (now $version), with the temporary Claude Code bridge: the README's download link points here. Installed, it keeps itself up to date from the numbered private-v pre-releases. Published releases never have the bridge." > latest.md
          title="Latest private build: Kelvin $version (not a release)"
          if gh release view private-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload private-latest out/Kelvin-Setup-private.exe --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit private-latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file latest.md \
              --prerelease --latest=false
          else
            gh release create private-latest out/Kelvin-Setup-private.exe --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes-file latest.md
          fi
      - name: Copies with fixed names, for links to the latest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # releases/latest/download/Kelvin-Setup.exe then always gives the newest installer (the README links it)
          cp out/Kelvin-Setup-*.exe out/Kelvin-Setup.exe
          cp out/Kelvin-*-macOS.zip out/Kelvin-macOS.zip
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Windows 10/11:** download `Kelvin-Setup-….exe` and run it. No admin rights are needed.
          The installer is not code-signed yet, so Windows may say "Windows protected your PC":
          click **More info → Run anyway**.

          **macOS (Apple silicon):** download `Kelvin-…-macOS.zip`, unzip it, and move `Kelvin.app`
          to Applications. The app is not signed yet, so the first time, right-click it and choose **Open**.

          Kelvin keeps its settings, API keys, chats and lab logs in `~/Kelvin` on your computer.
          It starts with a simulated lab and a scripted demo model; add an API key under Settings
          to talk to Claude, GPT or Gemini.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Kelvin ${GITHUB_REF_NAME#v}" --notes-file notes.md
