name: iOS app

# The iPhone app (ios/). KelvinKit's tests run on Linux first; only when they pass does the app build and run its
# tests on a macOS runner with the iOS Simulator (macOS minutes cost ten times Linux ones on a private repository).
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: KelvinKit (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/KelvinKit

  app:
    name: App (iOS Simulator)
    needs: kit
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        # Signed to run locally (no team needed on the simulator), so the app may use the Keychain.
        run: |
          set -o pipefail
          xcodebuild test -project ios/Kelvin.xcodeproj -scheme Kelvin \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee build.log | grep -E "error:|warning: .*(Kelvin|KelvinKit)/|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
