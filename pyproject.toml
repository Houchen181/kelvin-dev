[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvin-lab"
version = "0.3.1"
description = "Kelvin, the coolest cat in the lab: a safety-gated AI lab assistant for experimental physicists"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
agent = ["mcp>=2.3"]           # the MCP server needs Python >= 3.10
web = ["mcp>=2.3", "starlette", "uvicorn", "anthropic>=1.15", "openai>=3", "google-genai>=2"]
hardware = ["pyvisa>=1.13", "pyvisa-py>=0.7", "pyserial>=3.5"]   # real instruments (VISA, serial)
zhinst = ["zhinst-core"]        # Zurich Instruments lock-ins through LabOne
qd = ["MultiPyVu"]              # Quantum Design PPMS, DynaCool, VersaLab, MPMS3 through MultiVu
desktop = ["kelvin-lab[web,hardware]", "pywebview>=5"]
dev = ["pytest>=6", "httpx"]

[project.scripts]
kelvin = "labharness.web.app:main"
kelvin-mcp = "labharness.agent.server:main"
kelvin-scan = "labharness.discovery:main"

[project.gui-scripts]
kelvin-app = "labharness.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labharness = ["data/*.yaml", "data/cards/*.yaml", "data/cards/*/*.yaml", "agent/ui.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
